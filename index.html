<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Trips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap">
    <style>
    :root {
        --navy:    #0A2463;
        --navy-2:  #1a3a7a;
        --gold:    #C9A227;
        --parch:   #F7F4EE;
        --slate:   #3D5068;
        --sub:     #64748B;
        --border:  #E2DDD6;
        --text:    #1A1A2E;
        --green:   #2A7A52;
        --mist:    #C8D4E8;
        --card-bg: #ffffff;
        --radius:  18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%;
        background: #070F1F;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
    }

    /* ── Centred app shell ── */
    .app-shell {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100dvh;
        background: var(--parch);
        box-shadow: 0 0 80px rgba(0,0,0,0.55);
    }

    /* ── Header ── */
    .page-header {
        background: linear-gradient(155deg, var(--navy) 0%, var(--navy-2) 100%);
        padding: 52px 22px 32px;
        color: white;
    }
    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
    }
    .wordmark {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
    }
    .avatar {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: var(--gold);
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700;
        color: var(--navy);
        font-family: 'DM Sans', sans-serif;
    }
    .greeting {
        font-size: 13px;
        font-weight: 300;
        color: rgba(255,255,255,0.55);
        margin-bottom: 5px;
    }
    .headline {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        color: white;
    }
    .headline .gold { color: var(--gold); }

    /* ── Section label ── */
    .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--sub);
        padding: 20px 18px 10px;
    }

    /* ── Trip card ── */
    .trip-card {
        margin: 0 14px 12px;
        background: var(--card-bg);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 2px 12px rgba(10,36,99,0.09), 0 0 0 1px rgba(10,36,99,0.06);
        text-decoration: none;
        color: inherit;
        display: block;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.13s, box-shadow 0.13s;
    }
    .trip-card:active { transform: scale(0.985); box-shadow: 0 1px 6px rgba(10,36,99,0.08); }

    .tc-band { height: 5px; }
    .tc-band.upcoming { background: linear-gradient(90deg, var(--navy), #2563eb); }
    .tc-band.past     { background: linear-gradient(90deg, #94a3b8, #cbd5e1); }

    .tc-inner {
        padding: 14px 16px 16px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
    }
    .tc-flag  { font-size: 32px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .tc-info  { flex: 1; min-width: 0; }
    .tc-name  {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 18px; font-weight: 700;
        color: var(--text); line-height: 1.2;
    }
    .tc-date  {
        font-size: 12px; color: var(--sub);
        margin-top: 3px; font-weight: 300;
    }
    .tc-pills {
        display: flex; gap: 6px;
        margin-top: 10px; flex-wrap: wrap; align-items: center;
    }
    .pill {
        font-size: 9px; font-weight: 700;
        letter-spacing: 0.8px; text-transform: uppercase;
        padding: 3px 8px; border-radius: 5px;
    }
    .pill-upcoming { background: #DBEAFE; color: #1E3A8A; }
    .pill-days     { background: var(--parch); color: var(--sub); border: 1px solid var(--border); }
    .pill-past     { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .tc-group {
        font-size: 11px; color: var(--sub);
        margin-top: 8px; display: flex; align-items: center; gap: 5px;
    }
    .tc-group::before {
        content: ''; display: inline-block;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--mist);
    }
    .tc-arrow {
        color: var(--mist); font-size: 20px;
        font-weight: 300; align-self: center; flex-shrink: 0;
    }

    /* ── "Add trip" placeholder ── */
    .add-card {
        margin: 4px 14px 32px;
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        padding: 22px 18px;
        text-align: center;
        color: var(--sub);
    }
    .add-icon  { font-size: 22px; margin-bottom: 7px; }
    .add-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .add-desc  { font-size: 11px; line-height: 1.6; }
    .add-desc code {
        background: rgba(10,36,99,0.07);
        border-radius: 4px; padding: 1px 5px;
        font-family: monospace; font-size: 10px;
    }
    </style>
</head>
<body>

<div class="app-shell">

    <div class="page-header">
        <div class="header-top">
            <div class="wordmark">Our Trips</div>
            <div class="avatar">PP</div>
        </div>
        <div class="greeting">Good to see you, Pratik</div>
        <div class="headline">Where to<br>next? <span class="gold">✈</span></div>
    </div>

    <!-- Upcoming -->
    <div class="section-label">Upcoming</div>

    <a class="trip-card" href="brussels-2026/">
        <div class="tc-band upcoming"></div>
        <div class="tc-inner">
            <div class="tc-flag">🇧🇪</div>
            <div class="tc-info">
                <div class="tc-name">Brussels</div>
                <div class="tc-date">12–15 November 2026</div>
                <div class="tc-pills">
                    <span class="pill pill-upcoming">Upcoming</span>
                    <span class="pill pill-days">4 days</span>
                </div>
                <div class="tc-group">Patels + Mistrys</div>
            </div>
            <div class="tc-arrow">›</div>
        </div>
    </a>

    <!-- Add new trip placeholder -->
    <div class="add-card">
        <div class="add-icon">🗺️</div>
        <div class="add-title">Add a new trip</div>
        <div class="add-desc">
            Duplicate the <code>brussels-2026/</code> folder,<br>
            rename it and update the <code>TRIP</code> config at the top of the script,<br>
            then add a card above linking to the new folder.
        </div>
    </div>

</div><!-- /app-shell -->

</body>
</html>
