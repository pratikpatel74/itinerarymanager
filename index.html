<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Trips</title>
    <style>
    :root {
        --primary: #1e3a8a;
        --primary-light: #3b82f6;
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    .page-header {
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        color: white;
        padding: 56px 20px 32px;
        text-align: center;
    }

    .page-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .page-header p  { font-size: 14px; opacity: 0.8; margin-top: 6px; }

    .trips-grid {
        display: grid;
        gap: 16px;
        padding: 20px 16px 32px;
        max-width: 480px;
        margin: 0 auto;
    }

    .trip-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: box-shadow 0.15s, transform 0.15s;
        -webkit-tap-highlight-color: transparent;
    }

    .trip-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    .trip-card-hero {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
    }

    .trip-card-body { padding: 14px 16px 16px; }

    .trip-card-name {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
    }

    .trip-card-dates {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 3px;
    }

    .trip-card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
    }

    .trip-status {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .trip-status.upcoming  { background: #dbeafe; color: #1d4ed8; }
    .trip-status.active    { background: #dcfce7; color: #166534; }
    .trip-status.past      { background: #f1f5f9; color: #64748b; }

    .trip-card-arrow {
        margin-left: auto;
        color: var(--primary-light);
        font-size: 18px;
        font-weight: 300;
    }

    .trip-card-group {
        font-size: 12px;
        color: var(--text-muted);
    }

    /* "Add new trip" placeholder card */
    .add-trip-card {
        background: white;
        border-radius: var(--radius);
        border: 2px dashed var(--border);
        padding: 28px 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.6;
    }

    .add-trip-icon {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .add-trip-title {
        font-weight: 700;
        font-size: 14px;
        color: var(--text);
        margin-bottom: 4px;
    }
    </style>
</head>
<body>

<div class="page-header">
    <h1>✈️ Our Trips</h1>
    <p>Tap a trip to open its guide</p>
</div>

<div class="trips-grid">

    <!-- Brussels 2026 -->
    <a class="trip-card" href="brussels-2026/">
        <div class="trip-card-hero" style="background: linear-gradient(135deg, #1e3a8a18, #2563eb18);">🇧🇪</div>
        <div class="trip-card-body">
            <div class="trip-card-name">Brussels</div>
            <div class="trip-card-dates">12–15 November 2026</div>
            <div class="trip-card-meta">
                <span class="trip-status upcoming">Upcoming</span>
                <span class="trip-card-group">Patels + Mistrys</span>
                <span class="trip-card-arrow">›</span>
            </div>
        </div>
    </a>

    <!-- Add new trip placeholder -->
    <div class="add-trip-card">
        <div class="add-trip-icon">🗺️</div>
        <div class="add-trip-title">Add a new trip</div>
        Duplicate the <code>brussels-2026/</code> folder,<br>
        rename it and update the <code>TRIP</code> config at the top of the script,<br>
        then add a card above linking to the new folder.
    </div>

</div>

</body>
</html>
