<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Guide · Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:    #C9A227;
            --gold-lt: rgba(201,162,39,0.12);
            --gold-md: rgba(201,162,39,0.28);
            --bg:      #0A0A0A;
            --surface: #1C1C1E;
            --surface2:#242426;
            --border:  rgba(255,255,255,0.08);
            --text:    #F2F2F2;
            --sub:     #8E8E93;
            --radius:  14px;
            --red:     #FF453A;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        /* subtle grid texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(201,162,39,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,162,39,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px 36px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-flags {
            font-size: 32px;
            line-height: 1;
            margin-bottom: 12px;
            display: block;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--sub);
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--gold);
        }

        input::placeholder { color: var(--sub); }

        .btn-signin {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: var(--gold);
            border: none;
            border-radius: 12px;
            color: #0A0A0A;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-signin:hover { opacity: 0.9; }
        .btn-signin:disabled { opacity: 0.5; cursor: wait; }

        .error-msg {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            background: rgba(255,69,58,0.1);
            border: 1px solid rgba(255,69,58,0.25);
            border-radius: 10px;
            color: var(--red);
            font-size: 13px;
            text-align: center;
        }

        .error-msg.visible { display: block; }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--sub);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <span class="brand-flags">🇫🇷 🇧🇪</span>
            <div class="brand-title">Trip Guide</div>
            <div class="brand-sub">Family Travel · 2025–2026</div>
        </div>
        <div class="divider"></div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-signin" id="signin-btn" onclick="signIn()">Sign In</button>
        <div class="error-msg" id="error-msg"></div>

        <p class="footer-note">No account? Contact Pratik to get access.</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehuhqzjnikvykldasygc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVodWhxempuaWt2eWtsZGFzeWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTc3NzEsImV4cCI6MjEwMzU3Mzc3MX0.Kv7ko_u34u6ZTTU2QU50UULpG0bOX6jyOsA8-ry9ltU';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // If already signed in, redirect to home
        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.replace('index.html');
        });

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') signIn();
        });

        async function signIn() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('signin-btn');
            const errEl    = document.getElementById('error-msg');

            errEl.classList.remove('visible');

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            const { error } = await sb.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.textContent = 'Sign In';

            if (error) {
                showError(error.message === 'Invalid login credentials'
                    ? 'Incorrect email or password.'
                    : error.message);
                return;
            }

            // Redirect to home on success
            window.location.replace('index.html');
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('visible');
        }
    </script>
</body>
</html>
