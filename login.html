<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Guide · Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:    #C9A227;
            --gold-lt: rgba(201,162,39,0.12);
            --bg:      #0A0A0A;
            --surface: rgba(22,22,24,0.82);
            --surface2:#242426;
            --border:  rgba(255,255,255,0.1);
            --text:    #F2F2F2;
            --sub:     #8E8E93;
            --red:     #FF453A;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Background slideshow ── */
        .bg-stage {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.8s ease;
        }
        .bg-slide.active { opacity: 1; }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(10,10,10,0.78) 0%, rgba(10,10,10,0.65) 100%);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        /* ── Layout ── */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        /* ── Card ── */
        .card {
            width: 100%;
            max-width: 360px;
            background: rgba(22,22,24,0.70);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 32px 32px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 24px 64px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
        }

        /* ── Brand ── */
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .flag-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .flag-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--sub);
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 26px;
        }

        /* ── Form ── */
        .field { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 7px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--gold);
            background: rgba(201,162,39,0.06);
        }

        input::placeholder { color: rgba(142,142,147,0.6); }

        .btn-signin {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            background: var(--gold);
            border: none;
            border-radius: 12px;
            color: #0A0A0A;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-signin:hover  { opacity: 0.92; }
        .btn-signin:active { transform: scale(0.98); }
        .btn-signin:disabled { opacity: 0.45; cursor: wait; }

        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(255,69,58,0.1);
            border: 1px solid rgba(255,69,58,0.25);
            border-radius: 10px;
            color: var(--red);
            font-size: 13px;
            text-align: center;
        }
        .error-msg.visible { display: block; }

        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: rgba(142,142,147,0.7);
        }

        /* ── Mobile compact ── */
        @media (max-width: 430px), (max-height: 700px) {
            .card {
                padding: 22px 22px 20px;
            }
            .brand {
                margin-bottom: 18px;
            }
            .flag-row {
                gap: 7px;
                margin-bottom: 10px;
            }
            .flag-circle {
                width: 30px;
                height: 30px;
            }
            .brand-title {
                font-size: 16px;
            }
            .brand-sub {
                font-size: 11px;
                margin-top: 3px;
            }
            .divider {
                margin-bottom: 18px;
            }
            .field {
                margin-bottom: 11px;
            }
        }

        /* ── City label strip at bottom ── */
        .city-strip {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Background slideshow -->
    <div class="bg-stage" id="bg-stage">
        <div class="bg-slide active" style="background-image:url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1607894379039-89be884f69df?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1548092304-e0205cb0031b?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/ZBBJy9kNDww?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/6-FLEicFzg0?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/RJHdS6xLNNg?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-slide" style="background-image:url('https://images.unsplash.com/wmxZxd9N7FE?auto=format&fit=crop&w=1200&q=70')"></div>
        <div class="bg-overlay"></div>
    </div>

    <!-- Login card -->
    <div class="card">
        <div class="brand">
            <div class="flag-row">
                <!-- France flag circle -->
                <svg class="flag-circle" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="cl-fr"><circle cx="22" cy="22" r="22"/></clipPath>
                    <g clip-path="url(#cl-fr)">
                        <rect width="44" height="44" fill="#fff"/>
                        <rect x="0"   width="14.67" height="44" fill="#002395"/>
                        <rect x="29.33" width="14.67" height="44" fill="#ED2939"/>
                    </g>
                </svg>
                <!-- Belgium flag circle -->
                <svg class="flag-circle" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="cl-be"><circle cx="22" cy="22" r="22"/></clipPath>
                    <g clip-path="url(#cl-be)">
                        <rect width="44" height="44" fill="#FAE042"/>
                        <rect x="0"   width="14.67" height="44" fill="#1E1E1E"/>
                        <rect x="29.33" width="14.67" height="44" fill="#EF3340"/>
                    </g>
                </svg>
                <!-- Spain flag circle -->
                <svg class="flag-circle" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="cl-es"><circle cx="22" cy="22" r="22"/></clipPath>
                    <g clip-path="url(#cl-es)">
                        <rect width="44" height="44" fill="#c60b1e"/>
                        <rect y="11" width="44" height="22" fill="#ffc400"/>
                    </g>
                </svg>
                <!-- Portugal flag circle -->
                <svg class="flag-circle" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="cl-pt"><circle cx="22" cy="22" r="22"/></clipPath>
                    <g clip-path="url(#cl-pt)">
                        <rect width="44" height="44" fill="#006600"/>
                        <rect x="17.6" width="26.4" height="44" fill="#FF0000"/>
                    </g>
                </svg>
            </div>
            <div class="brand-title">Trip Guide</div>
            <div class="brand-sub">Family Travel · 2025–2026</div>
        </div>

        <div class="divider"></div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-signin" id="signin-btn" onclick="signIn()">Sign In</button>
        <div class="error-msg" id="error-msg"></div>

        <p class="footer-note">No account? Contact Pratik to get access.</p>
    </div>

    <div class="city-strip" id="city-strip">Paris · Brussels · Barcelona · Lisbon</div>

    <script>
        const SUPABASE_URL = 'https://ehuhqzjnikvykldasygc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVodWhxempuaWt2eWtsZGFzeWdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTc3NzEsImV4cCI6MjEwMzU3Mzc3MX0.Kv7ko_u34u6ZTTU2QU50UULpG0bOX6jyOsA8-ry9ltU';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Redirect if already signed in
        sb.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.replace('index.html');
        });

        // Background slideshow
        (function() {
            const slides = Array.from(document.querySelectorAll('.bg-slide'));
            const labels = ['Paris', 'Paris', 'Brussels', 'Brussels', 'Barcelona', 'Barcelona', 'Lisbon', 'Lisbon'];
            const strip  = document.getElementById('city-strip');
            let cur = 0;
            setInterval(() => {
                slides[cur].classList.remove('active');
                cur = (cur + 1) % slides.length;
                slides[cur].classList.add('active');
                if (strip) strip.textContent = labels[cur];
            }, 4000);
        })();

        // Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') signIn();
        });

        async function signIn() {
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('signin-btn');
            const errEl    = document.getElementById('error-msg');

            errEl.classList.remove('visible');

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';

            const { error } = await sb.auth.signInWithPassword({ email, password });

            btn.disabled = false;
            btn.textContent = 'Sign In';

            if (error) {
                showError(error.message === 'Invalid login credentials'
                    ? 'Incorrect email or password.'
                    : error.message);
                return;
            }

            window.location.replace('index.html');
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('visible');
        }
    </script>
</body>
</html>
